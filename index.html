<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能投资配置方案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC",-apple-system,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}
.container{background:#fff;border-radius:12px;padding:60px 40px;max-width:650px;box-shadow:0 8px 32px rgba(0,0,0,.2);text-align:center}
h1{color:#333;font-size:2.5em;margin-bottom:16px;font-weight:700}
.badge{display:inline-block;background:linear-gradient(135deg,#00a870,#52C41A);color:#fff;padding:4px 12px;border-radius:16px;font-size:0.7em;margin-left:8px;font-weight:600}
.subtitle{color:#666;font-size:1.2em;margin-bottom:40px;line-height:1.6}
.button{display:inline-block;background:linear-gradient(135deg,#0066cc,#004c99);color:#fff;text-decoration:none;padding:18px 48px;border-radius:8px;font-size:1.2em;font-weight:600;box-shadow:0 4px 16px rgba(0,102,204,.3);transition:all .3s}
.button:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,102,204,.4)}
.features{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;background:#f8f9fa;border-radius:8px}
.feature{text-align:center;padding:12px}
.feature-icon{font-size:1.8em;margin-bottom:8px}
.feature-text{font-size:0.9em;color:#666;font-weight:500}
@media(max-width:640px){.container{padding:40px 24px}.features{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>🎯 智能投资配置方案<span class="badge">精品</span></h1>
<p class="subtitle">20万元 · 3年期 · 稳健型策略<br><small style="font-size:0.85em;color:#999;">专业级投资方案可视化</small></p>
<a href="/investment-plan.html" class="button">查看完整方案 →</a>
<div class="features">
<div class="feature"><div class="feature-icon">📊</div><div class="feature-text">数据可视化</div></div>
<div class="feature"><div class="feature-icon">📱</div><div class="feature-text">移动端适配</div></div>
<div class="feature"><div class="feature-icon">🎨</div><div class="feature-text">专业设计</div></div>
</div>
</div>
</body>
</html>
