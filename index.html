<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能投资配置方案</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC",-apple-system,sans-serif;background:#F3F3F3;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}
.container{background:#fff;border-radius:12px;padding:60px 40px;max-width:650px;box-shadow:0 2px 8px rgba(0,0,0,.08);text-align:center}
h1{color:#000;font-size:2.5em;margin-bottom:16px;font-weight:600}
.badge{display:inline-block;background:#0052D9;color:#fff;padding:4px 12px;border-radius:16px;font-size:0.7em;margin-left:8px;font-weight:600}
.subtitle{color:#666;font-size:1.2em;margin-bottom:40px;line-height:1.6}
.button{display:inline-block;background:linear-gradient(135deg,#0052D9,#003CAB);color:#fff;text-decoration:none;padding:18px 48px;border-radius:8px;font-size:1.2em;font-weight:600;box-shadow:0 2px 8px rgba(0,82,217,.2);transition:all .3s}
.button:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,82,217,.3)}
.features{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:24px;background:#F8F9FA;border-radius:8px}
.feature{text-align:center;padding:12px}
.feature-icon{font-size:1.8em;margin-bottom:8px}
.feature-text{font-size:0.9em;color:#666;font-weight:500}
@media(max-width:640px){.container{padding:40px 24px}.features{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>🎯 智能投资配置方案<span class="badge">TDesign</span></h1>
<p class="subtitle">20万元 · 3年期 · 稳健型策略<br><small style="font-size:0.85em;color:#999;">简约 · 专业 · 精致</small></p>
<a href="/investment-plan.html" class="button">查看完整方案 →</a>
<div class="features">
<div class="feature"><div class="feature-icon">🎨</div><div class="feature-text">TDesign风格</div></div>
<div class="feature"><div class="feature-icon">📊</div><div class="feature-text">数据可视化</div></div>
<div class="feature"><div class="feature-icon">📱</div><div class="feature-text">移动端适配</div></div>
</div>
</div>
</body>
</html>
